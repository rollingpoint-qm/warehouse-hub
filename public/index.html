<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#17212b;--ink2:#5b6773;--line:#e1ddd5;--bg:#f5f3ee;--card:#fff;--side:#14202b;--side2:#9fb0bf;
--brand:#0f766e;--brand-d:#0b5a54;--amber:#b7791f;--amber-bg:#fdf3dc;--red:#b42318;--red-bg:#fde8e6;--green:#157347;--green-bg:#e3f4ea;--blue:#1d4ed8;--blue-bg:#e6edfd;--grey-bg:#ece9e2;
--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:15px;letter-spacing:.04em;margin:2px 8px 18px;text-transform:uppercase;font-weight:600}
aside h1 span{color:#5eead4}
aside a{display:block;color:var(--side2);text-decoration:none;padding:8px 10px;border-radius:6px;margin-bottom:2px;font-weight:500}
aside a:hover{background:#1d2d3b;color:#fff}aside a.on{background:#0f766e;color:#fff}
aside .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6b7f90;margin:16px 10px 6px}
main{padding:0 28px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:22px;gap:16px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;font-weight:600}.me{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.me select,.me input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}.tile b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.tile span{color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #efece6;vertical-align:top}tr:last-child td{border-bottom:0}tr.click:hover{background:#faf8f4;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-size:12.5px}.muted{color:var(--ink2)}.small{font-size:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.03em;background:var(--grey-bg);color:#4a4338;white-space:nowrap}
.chip.g{background:var(--green-bg);color:var(--green)}.chip.a{background:var(--amber-bg);color:var(--amber)}.chip.r{background:var(--red-bg);color:var(--red)}.chip.b{background:var(--blue-bg);color:var(--blue)}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:#bdb7a9}button.p{background:var(--brand);border-color:var(--brand);color:#fff}button.p:hover{background:var(--brand-d)}
button.d{color:var(--red);border-color:#efc3be}button.s{padding:3px 9px;font-size:12px}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.back{color:var(--brand);cursor:pointer;font-weight:500;margin-bottom:10px;display:inline-block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 22px}.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.warn{background:var(--amber-bg);border:1px solid #f0d9a4;color:#7a5410;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.warn ul{margin:6px 0 0 18px;padding:0}.err{background:var(--red-bg);border:1px solid #f1c0ba;color:var(--red);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.steps{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}.step{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px}
.step b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}.step.done{background:var(--green-bg);border-color:#bfe3cd}.step.cur{border-color:var(--brand);box-shadow:0 0 0 2px #0f766e22}.step.no{background:var(--red-bg)}
#modal{position:fixed;inset:0;background:#0b121a99;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
#modal.on{display:flex}.dlg{background:#fff;border-radius:12px;width:min(760px,100%);padding:20px 22px;box-shadow:0 20px 60px #0006}
.dlg h3{margin:0 0 14px;font-size:17px;font-weight:600}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:3px}
.fgrid input,.fgrid select,.fgrid textarea,input.in,select.in{width:100%;padding:7px 9px;border:1px solid #cfc9bb;border-radius:6px;font:inherit;background:#fff}
.fgrid textarea{min-height:70px;font-family:var(--mono);font-size:12.5px}.fgrid .sec{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:8px}
.fgrid .help{font-size:11px;color:var(--ink2);margin-top:2px}.fgrid .chk{display:flex;gap:8px;align-items:flex-start}.fgrid .chk input{width:auto;margin-top:3px}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:420px}
.t{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px #0004}.t.bad{background:#7f1d1d}.t ul{margin:6px 0 0 16px;padding:0;font-size:12px}
.label{border:2px solid #000;padding:14px;font-family:var(--mono);width:380px;margin:0 auto;background:#fff;color:#000}
.label hr{border:0;border-top:2px solid #000;margin:8px 0}.label .big{font-size:20px;font-weight:600;letter-spacing:.03em}
.tree td:first-child{font-family:var(--mono);font-size:12.5px}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto}.fgrid{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Warehouse<span>Hub</span></h1>
    <a href="#dashboard" data-nav="dashboard">Dashboard</a>
    <div class="grp">Procure</div>
    <a href="#vendors" data-nav="vendors">Vendors</a>
    <a href="#items" data-nav="items">Items &amp; SKUs</a>
    <a href="#reorder" data-nav="reorder">Reorder (min/max)</a>
    <a href="#pos" data-nav="pos">Purchase orders</a>
    <div class="grp">Inventory</div>
    <a href="#sites" data-nav="sites">Warehouses &amp; fleets</a>
    <a href="#stock" data-nav="stock">Stock</a>
    <div class="grp">Fulfil</div>
    <a href="#orders" data-nav="orders">Pick · Pack · Ship</a>
    <div class="grp">Control</div>
    <a href="#audit" data-nav="audit">Audit log</a>
  </aside>
  <main>
    <div class="top"><h2 id="title"></h2>
      <div class="me"><span>Acting as</span><input id="meUser" size="9"><select id="meRole"></select></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div><div id="toast"></div>

<script>
'use strict';
// ------------------------------------------------------------------ core helpers
const ROLES=['ADMIN','PROCUREMENT','COMPLIANCE','FINANCE','WAREHOUSE'];
let ME=(()=>{try{return JSON.parse(localStorage.getItem('wh.me'))||{user:'admin',role:'ADMIN'}}catch{return {user:'admin',role:'ADMIN'}}})();
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>n==null?'':Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>n==null?'':'$'+fmt(n,2);
const dt=s=>s?String(s).replace('T',' ').slice(0,16):'';
const TONE={ACTIVE:'g',PASSED:'g',VERIFIED:'g',APPROVED:'g',RECEIVED:'g',SHIPPED:'g',COMPLETE:'g',PICKED:'g',CLOSED:'g',OK:'g',
 UNDER_REVIEW:'b',PENDING:'a',DRAFT:'',OPEN:'b',PARTIALLY_RECEIVED:'a',PARTIALLY_ALLOCATED:'a',PARTIALLY_SHIPPED:'a',ALLOCATED:'b',PICKING:'b',PACKING:'b',PACKED:'b',NEW:'',IN_PROGRESS:'b',ON_ORDER:'b',
 REJECTED:'r',FAILED:'r',SUSPENDED:'r',CANCELLED:'r',SHORT:'r',REORDER_NEEDED:'r',NO_ELIGIBLE_VENDOR:'r',INACTIVE:'r'};
const chip=s=>`<span class="chip ${TONE[s]??''}">${esc(String(s).replace(/_/g,' '))}</span>`;
async function api(method,path,body){
  const r=await fetch('/api'+path,{method,headers:{'content-type':'application/json','x-user':ME.user,'x-role':ME.role},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error(j&&j.error||r.statusText);e.details=j&&j.details;e.status=r.status;throw e}
  return j;
}
const GET=p=>api('GET',p),POST=(p,b={})=>api('POST',p,b),PUT=(p,b)=>api('PUT',p,b),PATCH=(p,b)=>api('PATCH',p,b),DEL=p=>api('DELETE',p);
function detailsList(d){if(!d)return'';const a=Array.isArray(d)?d:[d];return '<ul>'+a.map(x=>`<li>${esc(typeof x==='string'?x:x.message?(x.field?x.field+': ':'')+x.message:JSON.stringify(x))}</li>`).join('')+'</ul>'}
function toast(msg,bad,details){const t=document.createElement('div');t.className='t'+(bad?' bad':'');t.innerHTML=esc(msg)+detailsList(details);$('#toast').append(t);setTimeout(()=>t.remove(),bad?9000:3500)}
function table(cols,rows,{click,cls=''}={}){
  if(!rows.length)return '<p class="muted">Nothing here yet.</p>';
  return `<table class="${cls}"><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>`+
   rows.map(r=>`<tr class="${click?'click':''}" ${click?`data-act="go" data-to="${esc(click(r))}"`:''}>`+cols.map(c=>`<td class="${c.num?'num':''} ${c.cls||''}">${c.f(r)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
}
const card=(title,body,actions='')=>`<div class="card"><h3><span>${title}</span><span class="row">${actions}</span></h3>${body}</div>`;

// ------------------------------------------------------------------ modal form builder
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
function openForm({title,fields,submit='Save',onSubmit,intro=''}){
  const f=fields.map(x=>{
    if(x.type==='section')return `<div class="sec">${esc(x.label)}</div>`;
    const id='f_'+x.name,full=x.full||x.type==='textarea'?'full':'',v=x.value??'';
    let input;
    if(x.type==='select')input=`<select id="${id}" name="${x.name}">${(x.options||[]).map(o=>{const val=typeof o==='object'?o.value:o,lab=typeof o==='object'?o.label:o;return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(x.type==='textarea')input=`<textarea id="${id}" name="${x.name}" placeholder="${esc(x.placeholder||'')}">${esc(v)}</textarea>`;
    else if(x.type==='checkbox')return `<div class="chk full"><input type="checkbox" id="${id}" name="${x.name}" ${v?'checked':''}><label for="${id}" style="margin:0;color:var(--ink)">${esc(x.label)}</label></div>`;
    else input=`<input id="${id}" name="${x.name}" type="${x.type||'text'}" value="${esc(v)}" placeholder="${esc(x.placeholder||'')}" ${x.step?`step="${x.step}"`:''}>`;
    return `<div class="${full}"><label for="${id}">${esc(x.label)}${x.required?' *':''}</label>${input}${x.help?`<div class="help">${esc(x.help)}</div>`:''}</div>`;
  }).join('');
  const m=$('#modal');
  m.innerHTML=`<form class="dlg"><h3>${esc(title)}</h3>${intro?`<p class="muted small">${intro}</p>`:''}<div id="ferr"></div><div class="fgrid">${f}</div>
   <div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" data-act="closeModal">Cancel</button><button class="p" type="submit">${esc(submit)}</button></div></form>`;
  m.classList.add('on');
  const form=$('form',m);
  form.onsubmit=async e=>{
    e.preventDefault();const vals={};
    for(const x of fields){if(x.type==='section')continue;const el=form.elements[x.name];
      vals[x.name]=x.type==='checkbox'?el.checked:el.value}
    try{await onSubmit(vals);closeModal()}
    catch(err){$('#ferr').innerHTML=`<div class="err"><b>${esc(err.message)}</b>${detailsList(err.details)}</div>`;$('.dlg').scrollIntoView()}
  };
}
const num=v=>v===''||v==null?undefined:Number(v);
const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);

// ------------------------------------------------------------------ router
const views={};let current={name:'',arg:''};
const TITLES={dashboard:'Dashboard',vendors:'Vendors',items:'Items & SKUs',reorder:'Reorder (min / max)',pos:'Purchase orders',sites:'Warehouses & fleets',stock:'Stock',orders:'Pick · Pack · Ship',audit:'Audit log'};
async function render(){
  const [name,arg]=(location.hash.slice(1)||'dashboard').split('/');
  current={name,arg:arg?decodeURIComponent(arg):''};
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===name));
  $('#title').textContent=TITLES[name]||'';
  const v=$('#view');
  try{v.innerHTML=await (views[name]||views.dashboard)(current.arg)}
  catch(e){v.innerHTML=`<div class="err"><b>${esc(e.message)}</b>${detailsList(e.details)}</div>`}
}
const refresh=()=>render();
window.addEventListener('hashchange',render);

// ------------------------------------------------------------------ actions (event delegation)
const actions={};
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=actions[el.dataset.act];if(!fn)return;
  e.stopPropagation();
  try{await fn(el.dataset,el)}catch(err){toast(err.message,true,err.details)}
});
actions.closeModal=closeModal;
actions.go=d=>{location.hash=d.to};
actions.back=d=>{location.hash=d.to};
const act=(name,fn)=>{actions[name]=fn};
const done=async(msg)=>{if(msg)toast(msg);await refresh()};

// ------------------------------------------------------------------ DASHBOARD
views.dashboard=async()=>{
  const [s,rs,vs]=await Promise.all([GET('/summary'),GET('/reorder/status'),GET('/vendors')]);
  const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
  const alerts=rs.filter(r=>['REORDER_NEEDED','NO_ELIGIBLE_VENDOR','ON_ORDER'].includes(r.state));
  const review=vs.filter(v=>v.status==='UNDER_REVIEW');
  return `<div class="grid g4" style="margin-bottom:16px">
   <div class="tile"><span>Active vendors</span><b>${s.vendors.ACTIVE||0}</b></div>
   <div class="tile"><span>Vendors in review</span><b>${s.vendors.UNDER_REVIEW||0}</b></div>
   <div class="tile"><span>SKUs</span><b>${s.skus}</b></div>
   <div class="tile"><span>Units on hand</span><b>${fmt(s.units_on_hand)}</b></div>
   <div class="tile"><span>Open POs</span><b>${(s.purchase_orders.OPEN||0)+(s.purchase_orders.PARTIALLY_RECEIVED||0)}</b></div>
   <div class="tile"><span>Orders in flight</span><b>${sum(s.orders)-(s.orders.SHIPPED||0)-(s.orders.CANCELLED||0)}</b></div>
   <div class="tile"><span>Open pick lists</span><b>${s.open_picks}</b></div>
   <div class="tile"><span>Bins to cycle-count</span><b>${s.cycle_count_flags}</b></div></div>
  <div class="grid g2">
   ${card('Stock alerts',table([{h:'SKU',f:r=>`<span class="mono">${esc(r.sku)}</span>`},{h:'Warehouse',f:r=>esc(r.site_code)},{h:'Available',num:1,f:r=>fmt(r.available)},{h:'Min',num:1,f:r=>r.min_qty},{h:'On order',num:1,f:r=>fmt(r.on_order)},{h:'State',f:r=>chip(r.state)}],alerts,{click:()=>'reorder'}))}
   ${card('Vendors awaiting approval',table([{h:'Code',f:v=>`<span class="mono">${esc(v.vendor_code)}</span>`},{h:'Vendor',f:v=>esc(v.legal_name)},{h:'Submitted',f:v=>dt(v.submitted_at)}],review,{click:v=>'vendors/'+v.id}))}</div>`;
};

// ------------------------------------------------------------------ VENDORS
const VENDOR_META={};
async function vendorMeta(){if(!VENDOR_META.loaded){Object.assign(VENDOR_META,await GET('/vendors/meta'),{loaded:true})}return VENDOR_META}
function vendorFields(v={},isNew=true){
  const m=VENDOR_META,yn=[{value:'',label:'—'},{value:'0',label:'No'},{value:'1',label:'Yes'}];
  const own=(v.beneficial_owners||[]).map(o=>`${o.name} | ${o.ownership_pct} | ${o.country}`).join('\n');
  const refs=(v.trade_references||[]).map(r=>`${r.company} | ${r.contact} | ${r.email} | ${r.phone}`).join('\n');
  const t=(name,label,extra={})=>({name,label,value:v[name]??'',...extra});
  return [
   {type:'section',label:'Company identity'},
   t('legal_name','Legal name',{required:1}),t('dba_name','Trade / DBA name'),
   t('business_type','Business type',{type:'select',options:['',...m.business_types]}),t('country_of_incorporation','Country of incorporation (ISO-2)',{placeholder:'US'}),
   t('tax_id','Tax ID / EIN',{placeholder:'12-3456789',help:v.tax_id_masked?`On file: ${v.tax_id_masked}. Leave blank to keep.`:''}),t('state_of_incorporation','State of incorporation'),
   t('registration_number','Business registration no.'),t('year_established','Year established',{type:'number'}),
   t('duns_number','D-U-N-S number'),t('website','Website'),t('product_categories','Product categories',{full:1,placeholder:'Fasteners, Tools'}),
   {type:'section',label:'Primary contact'},
   t('primary_contact_name','Contact name'),t('primary_contact_title','Title'),t('primary_contact_email','Email'),t('primary_contact_phone','Phone'),
   {type:'section',label:'Business address'},
   t('address_line1','Street address'),t('address_line2','Address line 2'),t('city','City'),t('state','State / Province'),t('postal_code','Postal code'),t('country','Country'),
   {type:'section',label:'Payment & banking'},
   t('payment_terms','Payment terms',{type:'select',options:['',...m.payment_terms]}),t('currency','Currency',{placeholder:'USD'}),
   t('bank_name','Bank name'),{name:'bank_routing_number',label:'Routing number',value:'',help:v.bank_routing_last4?`On file: ••••${v.bank_routing_last4}. Leave blank to keep.`:'US: 9-digit ABA, checksum validated'},
   {name:'bank_account_number',label:'Account number',value:'',help:v.bank_account_last4?`On file: ••••${v.bank_account_last4}. Leave blank to keep.`:'Only the last 4 digits are stored'},
   t('lead_time_days_default','Default lead time (days)',{type:'number'}),t('min_order_value','Minimum order value',{type:'number'}),
   {type:'section',label:`Insurance & licence (min ${m.min_days_valid} days validity, coverage ≥ ${fmt(m.min_coverage)})`},
   t('insurance_provider','Insurance provider'),t('insurance_policy_number','Policy number'),t('insurance_coverage_amount','Coverage amount',{type:'number'}),t('insurance_expiry','Insurance expiry',{type:'date',help:'Also set by the insurance certificate upload'}),
   t('business_license_number','Business licence no.'),t('business_license_expiry','Licence expiry',{type:'date'}),
   {type:'section',label:'Ownership & references'},
   {name:'beneficial_owners',label:'Beneficial owners (one per line: Name | Ownership % | Country)',type:'textarea',value:own,placeholder:'Dana Reyes | 60 | US'},
   {name:'trade_references',label:'Trade references, at least 2 (one per line: Company | Contact | Email | Phone)',type:'textarea',value:refs,placeholder:'Globex | Hank | hank@globex.com | 212-555-0101'},
   {type:'section',label:'Compliance declarations'},
   t('conflict_of_interest','Any conflict of interest with our staff?',{type:'select',options:yn,value:v.conflict_of_interest==null?'':String(v.conflict_of_interest)}),t('conflict_details','Conflict details'),
   {name:'code_of_conduct_accepted',type:'checkbox',label:'Vendor accepts the Supplier Code of Conduct',value:v.code_of_conduct_accepted===1},
   {name:'anti_bribery_attested',type:'checkbox',label:'Vendor attests to anti-bribery / anti-corruption compliance',value:v.anti_bribery_attested===1},
   {name:'sanctions_attested',type:'checkbox',label:'Vendor attests to sanctions & export-control compliance',value:v.sanctions_attested===1},
  ];
}
function vendorPayload(x){
  const o={};
  for(const [k,v] of Object.entries(x)){
    if(['beneficial_owners','trade_references'].includes(k))continue;
    if(['code_of_conduct_accepted','anti_bribery_attested','sanctions_attested'].includes(k)){o[k]=v?1:0;continue}
    if(['conflict_of_interest'].includes(k)){if(v!=='')o[k]=Number(v);continue}
    if(v==='')continue;
    o[k]=['year_established','lead_time_days_default','min_order_value','insurance_coverage_amount'].includes(k)?Number(v):v;
  }

async function vendorDetail(id){
  const d=await GET('/vendors/'+id),v=d.vendor,st=v.status;
  const mine=(stage)=>({COMPLIANCE:'COMPLIANCE',FINANCE:'FINANCE',PROCUREMENT:'PROCUREMENT'}[stage]===ME.role||ME.role==='ADMIN');
  const docRows=[...new Set([...d.required_documents,...d.documents.map(x=>x.doc_type)])].map(t=>({type:t,doc:d.documents.find(x=>x.doc_type===t),req:d.required_documents.includes(t)}));
  const btns=[];
  if(st==='DRAFT')btns.push(`<button data-act="editVendor" data-id="${id}">Edit profile</button><button class="p" data-act="submitVendor" data-id="${id}">Submit for review</button>`);
  if(st==='ACTIVE')btns.push(`<button class="d" data-act="suspendVendor" data-id="${id}">Suspend</button>`);
  if(st==='SUSPENDED')btns.push(`<button class="p" data-act="reinstateVendor" data-id="${id}">Reinstate</button>`);
  if(st==='REJECTED')btns.push(`<button data-act="reopenVendor" data-id="${id}">Reopen as draft</button>`);
  const nextStage=d.approvals.find(a=>a.decision==='PENDING');
  return `<span class="back" data-act="back" data-to="vendors">← All vendors</span>
  <div class="card"><div class="row"><div><h2 style="margin:0">${esc(v.legal_name)} ${chip(st)}</h2><div class="muted"><span class="mono">${esc(v.vendor_code)}</span>${v.status_reason?' · '+esc(v.status_reason):''}</div></div><span class="sp"></span>${btns.join('')}</div></div>
  ${d.blockers.length?`<div class="warn"><b>${st==='DRAFT'?'Before this vendor can be submitted / activated':'Still outstanding before activation'} (${d.blockers.length})</b><ul>${d.blockers.slice(0,14).map(b=>`<li>${esc(b)}</li>`).join('')}${d.blockers.length>14?`<li>…and ${d.blockers.length-14} more</li>`:''}</ul></div>`:''}
  ${card('Approval chain',`<div class="steps">${d.approvals.length?d.approvals.map(a=>`<div class="step ${a.decision==='APPROVED'?'done':a.decision==='REJECTED'?'no':(nextStage&&nextStage.stage===a.stage?'cur':'')}"><b>${a.seq}. ${a.stage}</b>${chip(a.decision)}<div class="small muted">${a.approver?esc(a.approver)+' · '+dt(a.decided_at):'waiting'}</div>
     ${st==='UNDER_REVIEW'&&nextStage&&nextStage.stage===a.stage&&mine(a.stage)?`<div style="margin-top:6px"><button class="s p" data-act="approve" data-id="${id}" data-stage="${a.stage}">Decide</button></div>`:''}</div>`).join(''):'<span class="muted">Starts when the application is submitted. Order: Compliance → Finance → Procurement. The submitter cannot approve, and nobody approves two stages.</span>'}</div>`)}
  ${card('Documents',table([{h:'Document',f:r=>`${esc(r.type.replace(/_/g,' '))}${r.req?' <span class="muted small">(required)</span>':''}`},{h:'Reference',f:r=>r.doc?esc(r.doc.file_name||r.doc.reference_no||''):'<span class="muted">not provided</span>'},
    {h:'Expires',f:r=>esc(r.doc?.expires_on||'')},{h:'Status',f:r=>r.doc?chip(r.doc.status):chip('MISSING')},{h:'',f:r=>`<button class="s" data-act="uploadDoc" data-id="${id}" data-type="${r.type}">${r.doc?'Replace':'Attach'}</button> ${r.doc&&st==='UNDER_REVIEW'?`<button class="s" data-act="verifyDoc" data-id="${id}" data-doc="${r.doc.id}">Review</button>`:''}`}],docRows),
    st!=='REJECTED'?`<button class="s" data-act="uploadDoc" data-id="${id}">+ Other document</button>`:'')}
  ${d.checks.length?card('Background checks',table([{h:'Check',f:c=>esc(c.label)},{h:'Status',f:c=>chip(c.status)},{h:'Evidence',f:c=>`<span class="mono">${esc(c.evidence_ref||'')}</span>`},{h:'Notes',f:c=>esc(c.notes||'')},{h:'By',f:c=>esc(c.performed_by||'')},
    {h:'',f:c=>st==='UNDER_REVIEW'?`<button class="s" data-act="recordCheck" data-id="${id}" data-type="${c.check_type}" data-auto="${c.automated}">${c.automated?'Re-run':'Record'}</button>`:''}],d.checks)):''}
  ${card('Profile',`<div class="kv">${[['Business type',v.business_type],['Tax ID',v.tax_id_masked],['Country',v.country_of_incorporation],['Established',v.year_established],['DUNS',v.duns_number],['Website',v.website],
    ['Contact',[v.primary_contact_name,v.primary_contact_email,v.primary_contact_phone].filter(Boolean).join(' · ')],['Address',[v.address_line1,v.city,v.state,v.postal_code,v.country].filter(Boolean).join(', ')],
    ['Payment terms',v.payment_terms],['Currency',v.currency],['Bank',v.bank_name?`${v.bank_name} ••••${v.bank_account_last4||''}`:''],['Lead time (days)',v.lead_time_days_default],
    ['Insurance',v.insurance_provider?`${v.insurance_provider} · ${money(v.insurance_coverage_amount)} · exp ${v.insurance_expiry||'?'}`:''],['Licence',v.business_license_number?`${v.business_license_number} · exp ${v.business_license_expiry||'?'}`:''],
    ['Beneficial owners',(v.beneficial_owners||[]).map(o=>`${o.name} ${o.ownership_pct}%`).join(', ')],['References',(v.trade_references||[]).map(r=>r.company).join(', ')]].map(([k,x])=>`<div><span>${k}</span>${esc(x||'—')}</div>`).join('')}</div>`)}
  ${card('History',table([{h:'When',f:a=>dt(a.ts)},{h:'Who',f:a=>esc(a.actor)},{h:'Action',f:a=>esc(a.action)},{h:'Detail',f:a=>`<span class="small muted">${esc(a.detail||'')}</span>`}],d.audit))}`;
}

    <div class="card"><div class="row"><div><h2 style="margin:0"><span class="mono">${esc(p.po_number)}</span> ${chip(p.status)} ${p.source==='AUTO_REORDER'?chip('AUTO REORDER'):''}</h2>
      <div class="muted">${esc(p.vendor.vendor_code)} · ${esc(p.vendor.legal_name)} → ${esc(p.site.code)} · ${esc(p.payment_terms||'')} · expected ${esc(p.expected_date||'')}</div></div><span class="sp"></span>
      ${can?`<button class="p" data-act="receivePo" data-id="${p.id}">Receive goods</button>`:''}${p.status==='OPEN'?`<button class="d" data-act="cancelPo" data-id="${p.id}">Cancel</button>`:''}</div></div>
    ${card('Lines (ordered on vendor item number)',table([{h:'#',f:l=>l.line_no},{h:'Vendor item no.',f:l=>`<b class="mono">${esc(l.vendor_item_number)}</b>`},{h:'Our SKU',f:l=>`<span class="mono">${esc(l.sku)}</span>`},{h:'Description',f:l=>esc(l.description)},
      {h:'Ordered',num:1,f:l=>`${l.qty_ordered} ${esc(l.vendor_uom||'')}`},{h:'Received',num:1,f:l=>l.qty_received},{h:'Pack',num:1,f:l=>l.pack_size},{h:'Unit cost',num:1,f:l=>money(l.unit_cost)},{h:'Line total',num:1,f:l=>money(l.qty_ordered*l.unit_cost)}],p.lines),`<b>${money(p.total_amount)} ${esc(p.currency||'')}</b>`)}
    ${p.receipts.length?card('Receipts',table([{h:'When',f:r=>dt(r.ts)},{h:'Vendor item',f:r=>`<span class="mono">${esc(r.vendor_item_number)}</span>`},{h:'Qty',num:1,f:r=>r.qty_vendor_uom},{h:'Base units',num:1,f:r=>r.qty_base},{h:'Location',f:r=>esc(r.location_code)},{h:'By',f:r=>esc(r.received_by)}],p.receipts)):''}`;
  }
  const rows=await GET('/purchase-orders');
  return card('Purchase orders',table([{h:'PO',f:p=>`<b class="mono">${esc(p.po_number)}</b>`},{h:'Vendor',f:p=>esc(p.legal_name)},{h:'Ship to',f:p=>esc(p.site_code)},{h:'Status',f:p=>chip(p.status)},{h:'Source',f:p=>p.source==='AUTO_REORDER'?chip('AUTO REORDER'):'Manual'},{h:'Lines',num:1,f:p=>p.line_count},{h:'Total',num:1,f:p=>money(p.total_amount)},{h:'Expected',f:p=>esc(p.expected_date||'')}],rows,{click:p=>'pos/'+p.id}),
   `<button class="p s" data-act="newPo">+ New purchase order</button>`);
};
act('newPo',async()=>{const [vs,sites]=await Promise.all([GET('/vendors?status=ACTIVE'),GET('/sites')]);
  openForm({title:'New purchase order',intro:'Lines use the <b>vendor\'s item number</b>, one per line: <code>VENDOR-ITEM-NO, qty</code> (qty in the vendor\'s unit of measure).',fields:[{name:'vendor_id',label:'Vendor',type:'select',options:vs.map(v=>({value:v.id,label:`${v.vendor_code} · ${v.legal_name}`}))},
   {name:'site_id',label:'Ship to warehouse',type:'select',options:sites.filter(s=>s.site_type==='WAREHOUSE').map(s=>({value:s.id,label:s.code+' · '+s.name}))},{name:'lines',label:'Lines',type:'textarea',required:1,placeholder:'ACME-BOLT-M8-12, 10'},{name:'notes',label:'Notes',full:1}],
   onSubmit:async x=>{const ls=lines(x.lines).map(l=>{const [n,q]=l.split(',').map(s=>s.trim());return{vendor_item_number:n,qty:Number(q)}});
     const p=await POST('/purchase-orders',{vendor_id:Number(x.vendor_id),site_id:Number(x.site_id),lines:ls,notes:x.notes});location.hash='pos/'+p.id}})});
act('cancelPo',d=>openForm({title:'Cancel purchase order',fields:[{name:'reason',label:'Reason',required:1,type:'textarea'}],onSubmit:async x=>{await POST(`/purchase-orders/${d.id}/cancel`,x);await done('Cancelled')}}));
act('receivePo',async d=>{const p=await GET('/purchase-orders/'+d.id);const locs=(await GET('/locations?site_id='+p.site_id)).filter(l=>l.loc_type!=='STAGING');
  const open=p.lines.filter(l=>l.qty_received<l.qty_ordered);
  openForm({title:'Receive '+p.po_number,intro:'Enter the quantity received for each line (vendor UoM). Goods land on the receiving dock unless you pick a location.',
   fields:[{name:'location',label:'Receive into',type:'select',options:locs.map(l=>({value:l.code,label:l.path})),value:locs.find(l=>l.loc_type==='DOCK')?.code},
    ...open.map(l=>({name:'q_'+l.vendor_item_number,label:`${l.vendor_item_number} (outstanding ${l.qty_ordered-l.qty_received} ${l.vendor_uom||''})`,type:'number',value:l.qty_ordered-l.qty_received}))],
   onSubmit:async x=>{const ls=open.map(l=>({vendor_item_number:l.vendor_item_number,qty:Number(x['q_'+l.vendor_item_number]),location:x.location})).filter(l=>l.qty>0);
     await POST(`/purchase-orders/${d.id}/receive`,{lines:ls});await done('Goods received')}})});

// ------------------------------------------------------------------ ORDERS: PICK / PACK / SHIP
const STAGES=['NEW','ALLOCATED','PICKED','PACKED','SHIPPED'];
views.orders=async(id)=>{
  if(id)return orderDetail(id);
  const rows=await GET('/orders');
  return card('Customer orders',table([{h:'Order',f:o=>`<b class="mono">${esc(o.order_number)}</b>`},{h:'Customer',f:o=>esc(o.customer_name)},{h:'Ship from',f:o=>esc(o.site_code)},{h:'Status',f:o=>chip(o.status)},
    {h:'Ordered',num:1,f:o=>o.qty_ordered},{h:'Allocated',num:1,f:o=>o.qty_allocated},{h:'Picked',num:1,f:o=>o.qty_picked},{h:'Packed',num:1,f:o=>o.qty_packed},{h:'Shipped',num:1,f:o=>o.qty_shipped}],rows,{click:o=>'orders/'+o.id}),
   `<button class="p s" data-act="newOrder">+ New order</button>`);
};
act('newOrder',async()=>{const sites=(await GET('/sites')).filter(s=>s.site_type==='WAREHOUSE');
  openForm({title:'New customer order',intro:'Lines, one per line: <code>SKU, qty</code>',fields:[{name:'site_id',label:'Ship from',type:'select',options:sites.map(s=>({value:s.id,label:s.code+' · '+s.name}))},{name:'customer_name',label:'Customer',required:1},
   {name:'ship_to_line1',label:'Ship-to street',required:1},{name:'ship_to_city',label:'City',required:1},{name:'ship_to_state',label:'State'},{name:'ship_to_postal_code',label:'Postal code',required:1},{name:'ship_to_country',label:'Country',required:1,value:'US'},
   {name:'carrier',label:'Carrier',placeholder:'UPS'},{name:'service_level',label:'Service',placeholder:'GROUND'},{name:'lines',label:'Lines',type:'textarea',required:1,placeholder:'SKU-000001, 10'}],
   onSubmit:async x=>{const ls=lines(x.lines).map(l=>{const [s,q]=l.split(',').map(t=>t.trim());return{sku:s,qty:Number(q)}});const b={...x,site_id:Number(x.site_id),lines:ls};
     const o=await POST('/orders',b);location.hash='orders/'+o.id}})});
act('allocate',async d=>{const r=await POST(`/orders/${d.id}/allocate`);await done(r.pick_list?`Pick list ${r.pick_list.pick_number} created (${r.pick_list.tasks} stops)`+(r.shortages.length?` · ${r.shortages.length} line(s) short`:''):'Nothing available to allocate')});
act('cancelOrder',d=>openForm({title:'Cancel order',fields:[{name:'reason',label:'Reason',required:1,type:'textarea'}],onSubmit:async x=>{await POST(`/orders/${d.id}/cancel`,x);await done('Order cancelled')}}));
act('pick',async(d,el)=>{const row=el.closest('tr');const g=n=>row.querySelector(`[data-f="${n}"]`).value;
  const body={scan_location:g('loc'),scan_item:g('item'),qty_picked:Number(g('qty'))};const sr=g('short');if(sr)body.short_reason=sr;
  const r=await POST(`/pick-tasks/${d.id}/confirm`,body);await done(r.short_qty?`Short pick recorded (${r.short_qty}). Allocate again to source the rest.`:'Picked')});
act('newCarton',async d=>{await POST(`/orders/${d.id}/cartons`);await done('Carton opened')});
act('packItem',async(d,el)=>{const wrap=el.closest('[data-carton]');await POST(`/cartons/${d.id}/items`,{scan_item:wrap.querySelector('[data-f="item"]').value,qty:Number(wrap.querySelector('[data-f="qty"]').value)});await done()});
act('unpack',async d=>{await DEL(`/cartons/${d.carton}/items/${d.id}`);await done()});
act('delCarton',async d=>{await DEL(`/cartons/${d.id}`);await done()});
act('closeCarton',d=>openForm({title:'Close carton',intro:'Weigh and measure the packed carton. A GS1 SSCC-18 is assigned when you close it.',fields:[{name:'weight_kg',label:'Measured weight (kg)',type:'number',step:'any',required:1},{name:'length_cm',label:'Length (cm)',type:'number',step:'any',required:1},{name:'width_cm',label:'Width (cm)',type:'number',step:'any',required:1},{name:'height_cm',label:'Height (cm)',type:'number',step:'any',required:1}],
  onSubmit:async x=>{const r=await POST(`/cartons/${d.id}/close`,{weight_kg:Number(x.weight_kg),length_cm:Number(x.length_cm),width_cm:Number(x.width_cm),height_cm:Number(x.height_cm)});toast('SSCC '+r.sscc_formatted);if(r.warning)toast(r.warning,true);await refresh()}}));
act('shipOrder',d=>openForm({title:'Confirm shipment',intro:'Ships every closed carton (or the ones you select), deducts stock from staging and issues a bill of lading.',fields:[{name:'carrier',label:'Carrier',required:1,value:d.carrier||''},{name:'service_level',label:'Service',value:d.service||''},{name:'tracking_number',label:'Tracking number',required:1,full:1}],
  onSubmit:async x=>{const r=await POST(`/orders/${d.id}/ship`,x);await done(`Shipped ${r.shipment.shipment_number} · ${r.shipment.bol_number}`)}}));
act('label',async d=>{const l=await GET(`/cartons/${d.id}/label`);
  $('#modal').innerHTML=`<div class="dlg"><h3>Shipping label</h3><div class="printable"><div class="label"><div class="small">SHIP TO</div><div class="big">${esc(l.ship_to.name)}</div><div>${esc(l.ship_to.line1)}</div><div>${esc([l.ship_to.city,l.ship_to.state,l.ship_to.postal_code].filter(Boolean).join(' '))} ${esc(l.ship_to.country)}</div><hr>
   <div>${esc(l.carrier||'')} ${esc(l.service_level||'')}</div><div>Tracking: ${esc(l.tracking_number||'— pending —')}</div><div>${esc(l.order_number)} · ${esc(l.carton_number)} · ${l.weight_kg} kg · ${esc(l.dimensions_cm)} cm</div><hr>
   <div class="small">SSCC-18 (GS1-128, AI 00)</div><div class="big">${esc(l.sscc_formatted)}</div><div class="small">Barcode data: ${esc(l.gs1_128_data)}</div><hr>
   <div class="small">CONTENTS</div>${l.contents.map(c=>`<div>${c.qty} × ${esc(c.sku)} ${esc(c.description)}</div>`).join('')}</div></div>
   <p class="muted small">Send the barcode data to your label printer (ZPL/GS1-128) for the scannable symbol.</p>
   <div class="row" style="justify-content:flex-end"><button data-act="closeModal">Close</button><button class="p" onclick="window.print()">Print</button></div></div>`;$('#modal').classList.add('on')});
act('slip',async d=>{const s=await GET(`/orders/${d.id}/packing-slip`);
  $('#modal').innerHTML=`<div class="dlg"><h3>Packing slip · ${esc(s.order_number)}</h3><div class="printable"><p><b>${esc(s.customer)}</b><br>${esc(s.ship_to.line1)}<br>${esc([s.ship_to.city,s.ship_to.state,s.ship_to.postal_code].filter(Boolean).join(' '))} ${esc(s.ship_to.country)}</p>
   ${table([{h:'SKU',f:l=>`<span class="mono">${esc(l.sku)}</span>`},{h:'Description',f:l=>esc(l.description)},{h:'Ordered',num:1,f:l=>l.qty_ordered},{h:'Shipped',num:1,f:l=>l.qty_shipped},{h:'Backordered',num:1,f:l=>l.qty_backordered}],s.lines)}
   <p class="small muted">Cartons: ${s.cartons.map(c=>esc(c.carton_number)).join(', ')||'—'}</p></div><div class="row" style="justify-content:flex-end"><button data-act="closeModal">Close</button><button class="p" onclick="window.print()">Print</button></div></div>`;$('#modal').classList.add('on')});

async function orderDetail(id){
  const o=await GET('/orders/'+id);
  const idx=o.status==='CANCELLED'?-1:Math.max(0,STAGES.findIndex(s=>s===({PARTIALLY_ALLOCATED:'NEW',PICKING:'ALLOCATED',PACKING:'PICKED',PARTIALLY_SHIPPED:'PACKED'}[o.status]||o.status)));
  const openTasks=o.pick_lists.flatMap(p=>p.tasks.map(t=>({...t,pick_number:p.pick_number})));
  const need=o.lines.some(l=>l.qty_allocated<l.qty_ordered);
  const toPack=o.lines.some(l=>l.qty_picked>l.qty_packed);
  const hasClosed=o.cartons.some(c=>c.status==='CLOSED');
  const live=!['CANCELLED','SHIPPED'].includes(o.status);
  return `<span class="back" data-act="back" data-to="orders">← All orders</span>
  <div class="card"><div class="row"><div><h2 style="margin:0"><span class="mono">${esc(o.order_number)}</span> ${chip(o.status)}</h2><div class="muted">${esc(o.customer_name)} · ${esc(o.ship_to_line1)}, ${esc(o.ship_to_city)} ${esc(o.ship_to_state||'')} ${esc(o.ship_to_postal_code)} · from ${esc(o.site_code)} · ${esc(o.carrier||'no carrier set')}</div></div><span class="sp"></span>
   ${live&&need?`<button class="p" data-act="allocate" data-id="${o.id}">Allocate &amp; create pick list</button>`:''}${hasClosed?`<button class="p" data-act="shipOrder" data-id="${o.id}" data-carrier="${esc(o.carrier||'')}" data-service="${esc(o.service_level||'')}">Confirm shipment</button>`:''}
   <button data-act="slip" data-id="${o.id}">Packing slip</button>${live&&!o.lines.some(l=>l.qty_picked>0)?`<button class="d" data-act="cancelOrder" data-id="${o.id}">Cancel</button>`:''}</div></div>
  <div class="steps">${STAGES.map((s,i)=>`<div class="step ${o.status==='CANCELLED'?'no':i<idx?'done':i===idx?'cur':''}"><b>${i+1}</b>${s==='NEW'?'Order':s==='ALLOCATED'?'Allocate':s==='PICKED'?'Pick':s==='PACKED'?'Pack':'Ship'}</div>`).join('')}</div>
  ${card('Lines',table([{h:'SKU',f:l=>`<span class="mono">${esc(l.sku)}</span>`},{h:'Description',f:l=>esc(l.description)},{h:'Ordered',num:1,f:l=>l.qty_ordered},{h:'Allocated',num:1,f:l=>l.qty_allocated},{h:'Picked',num:1,f:l=>l.qty_picked},{h:'Packed',num:1,f:l=>l.qty_packed},{h:'Shipped',num:1,f:l=>l.qty_shipped}],o.lines))}
  ${openTasks.length?card('Pick list (walk order)',`<p class="muted small" style="margin-top:0">Scan the bin label and the item barcode (or type the SKU) to confirm each pick. Picking less than requested records a short pick, flags the bin for a count and releases the reservation.</p>`+
   table([{h:'List',f:t=>`<span class="mono small">${esc(t.pick_number)}</span>`},{h:'Go to',f:t=>`<b class="mono">${esc(t.location_code)}</b>`},{h:'SKU',f:t=>`<span class="mono">${esc(t.sku)}</span><div class="small muted">${esc(t.barcode||'')}</div>`},{h:'Qty',num:1,f:t=>t.qty_to_pick},
    {h:'Status',f:t=>chip(t.status)+(t.short_reason?`<div class="small muted">${esc(t.short_reason)}</div>`:'')},
    {h:'Confirm',f:t=>t.status!=='OPEN'?`${t.qty_picked} picked`:`<div class="row"><input class="in" style="width:130px" data-f="loc" placeholder="scan bin"><input class="in" style="width:130px" data-f="item" placeholder="scan item"><input class="in" style="width:60px" type="number" data-f="qty" value="${t.qty_to_pick}"><input class="in" style="width:130px" data-f="short" placeholder="short reason"><button class="s p" data-act="pick" data-id="${t.id}">Pick</button></div>`}],openTasks)):''}
  ${card('Packing',`${o.cartons.map(c=>`<div data-carton="${c.id}" style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px"><div class="row"><b class="mono">${esc(c.carton_number)}</b> ${chip(c.status)}${c.sscc?`<span class="mono small muted">SSCC ${esc(c.sscc)}</span>`:''}<span class="sp"></span>
     ${c.status!=='OPEN'?`<button class="s" data-act="label" data-id="${c.id}">Label</button>`:''}${c.status==='OPEN'&&c.items.length?`<button class="s p" data-act="closeCarton" data-id="${c.id}">Weigh &amp; close</button>`:''}${c.status==='OPEN'&&!c.items.length?`<button class="s d" data-act="delCarton" data-id="${c.id}">Remove</button>`:''}</div>
     ${c.items.length?`<table style="margin-top:6px">${c.items.map(i=>`<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.description)}</td><td class="num">${i.qty}</td><td class="num">${c.status==='OPEN'?`<button class="s" data-act="unpack" data-carton="${c.id}" data-id="${i.id}">remove</button>`:''}</td></tr>`).join('')}</table>`:'<div class="muted small" style="margin-top:6px">Empty</div>'}
     ${c.status==='OPEN'?`<div class="row" style="margin-top:8px"><input class="in" style="width:170px" data-f="item" placeholder="scan item / SKU"><input class="in" style="width:70px" type="number" data-f="qty" value="1"><button class="s" data-act="packItem" data-id="${c.id}">Add to carton</button></div>`:`<div class="small muted" style="margin-top:6px">${c.weight_kg} kg · ${c.length_cm}×${c.width_cm}×${c.height_cm} cm</div>`}</div>`).join('')||'<p class="muted">No cartons yet.</p>'}`,
   toPack&&live?`<button class="s p" data-act="newCarton" data-id="${o.id}">+ New carton</button>`:'')}
  ${o.shipments.length?card('Shipments',table([{h:'Shipment',f:s=>`<span class="mono">${esc(s.shipment_number)}</span>`},{h:'BOL',f:s=>`<span class="mono">${esc(s.bol_number)}</span>`},{h:'Carrier',f:s=>esc(s.carrier+(s.service_level?' · '+s.service_level:''))},{h:'Tracking',f:s=>`<span class="mono">${esc(s.tracking_number)}</span>`},{h:'Weight kg',num:1,f:s=>s.total_weight_kg},{h:'Shipped',f:s=>dt(s.shipped_at)+' by '+esc(s.shipped_by)}],o.shipments)):''}`;
}

// ------------------------------------------------------------------ AUDIT
views.audit=async()=>card('Latest 200 events',table([{h:'When',f:a=>dt(a.ts)},{h:'Who',f:a=>esc(a.actor)},{h:'Entity',f:a=>esc(a.entity+' #'+(a.entity_id??''))},{h:'Action',f:a=>esc(a.action)},{h:'Detail',f:a=>`<span class="small muted">${esc((a.detail||'').slice(0,160))}</span>`}],await GET('/audit')));

// ------------------------------------------------------------------ identity switcher + boot
(function(){
  const u=$('#meUser'),r=$('#meRole');
  r.innerHTML=ROLES.map(x=>`<option ${x===ME.role?'selected':''}>${x}</option>`).join('');u.value=ME.user;
  const save=()=>{ME={user:u.value.trim()||'admin',role:r.value};localStorage.setItem('wh.me',JSON.stringify(ME));render()};
  u.onchange=save;r.onchange=save;
})();
render();
</script>
